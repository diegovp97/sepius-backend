version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sepius-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sepius
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sepius_dev}
      - POSTGRES_DB=sepius
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sepius -d sepius"]
      interval: 10s
      timeout: 5s
      retries: 5

  sepius-api:
    build:
      context: .
      dockerfile: src/Sepius.API/Dockerfile
    container_name: sepius-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "80:8080"
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - TwitchApi__ClientId=${TWITCH_CLIENT_ID}
      - TwitchApi__ClientSecret=${TWITCH_CLIENT_SECRET}
      # Authorization Code Flow — user access token + refresh token para EventSub WebSocket
      - TwitchApi__UserAccessToken=${TWITCH_USER_ACCESS_TOKEN:-}
      - TwitchApi__RefreshToken=${TWITCH_REFRESH_TOKEN:-}
      - TwitchApi__RedirectUri=${TWITCH_REDIRECT_URI:-http://localhost}
      - Streamlink__OutputPath=/recordings
      - Streamlink__TwitchCookiesPath=/run/secrets/sepius/twitch-cookies.txt
      - Monitor__PollingIntervalSeconds=120
      - Monitor__Channels__0=elttblue
      - Monitor__Channels__1=kick:elttblue
      - AllowedOrigins=${ALLOWED_ORIGINS:-http://localhost:4200}
      # Autenticación: ambas son obligatorias (la API no arranca sin ellas)
      - Auth__JwtKey=${JWT_KEY:?define JWT_KEY en .env (openssl rand -base64 48)}
      - Auth__AdminPassword=${ADMIN_PASSWORD:?define ADMIN_PASSWORD en .env (min. 12 caracteres)}
      - YouTube__Enabled=${YOUTUBE_ENABLED:-false}
      - YouTube__ClientId=${YOUTUBE_CLIENT_ID:-}
      - YouTube__ClientSecret=${YOUTUBE_CLIENT_SECRET:-}
      - YouTube__RefreshToken=${YOUTUBE_REFRESH_TOKEN:-}
      - YouTube__PrivacyStatus=${YOUTUBE_PRIVACY_STATUS:-unlisted}
      # Copia de seguridad en Google Drive antes de subir a YouTube (opcional)
      - GoogleDrive__Enabled=${GOOGLE_DRIVE_ENABLED:-false}
      - GoogleDrive__ClientId=${GOOGLE_DRIVE_CLIENT_ID:-}
      - GoogleDrive__ClientSecret=${GOOGLE_DRIVE_CLIENT_SECRET:-}
      - GoogleDrive__RefreshToken=${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      - GoogleDrive__RootFolderName=${GOOGLE_DRIVE_FOLDER:-Sepius}
      # No subir grabaciones que duren menos de N minutos (anuncios, arranques fallidos). 0 = subir todo
      - Pipeline__MinDurationMinutes=${PIPELINE_MIN_MINUTES:-5}
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=sepius;Username=sepius;Password=${POSTGRES_PASSWORD:-sepius_dev}
    volumes:
      - recordings_data:/recordings
      - ./secrets:/run/secrets/sepius:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  recordings_data:
    driver: local
  postgres_data:
    driver: local
